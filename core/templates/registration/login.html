{% extends 'base.html' %}
{% load static %}
{% block main %}

<div class="w-full max-w-md mx-auto my-10 animate-fade-in">
    <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl rotate-12 mb-4 shadow-lg shadow-indigo-500/40">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white -rotate-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 00-2 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>
        <h1 class="text-4xl font-black text-white tracking-tighter">Welcome Back</h1>
        <p class="text-gray-400 mt-2">Log in to manage your productivity</p>
    </div>

    <div class="bg-white/10 backdrop-blur-2xl rounded-[2.5rem] border border-white/20 shadow-2xl p-8 md:p-10">
        
        <form method='post' class="space-y-6 custom-django-form">
            {% csrf_token %}

            <div class="text-gray-200">
                {{ form.as_p }}
            </div>

            <button type='submit' class="w-full bg-white hover:bg-gray-100 text-gray-900 font-bold py-4 rounded-2xl shadow-xl transition-all transform hover:scale-[1.02] active:scale-95">
                Login
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-white/10 text-center">
            <p class="text-gray-400 text-sm">
                Don't have an account? 
                <a href="{% url 'register' %}" class="text-indigo-400 font-bold hover:underline ml-1">Register here</a>
            </p>
        </div>
    </div>
</div>

<style>
    /* Styling Django's form fields to match the glass theme */
    .custom-django-form p {
        margin-bottom: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .custom-django-form label {
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #818cf8; /* indigo-400 */
        margin-left: 0.25rem;
    }

    .custom-django-form input {
        width: 100%;
        background-color: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 1rem;
        padding: 1rem;
        color: white;
        transition: all 0.3s ease;
    }

    .custom-django-form input:focus {
        outline: none;
        border-color: #818cf8;
        background-color: rgba(0, 0, 0, 0.6);
        box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.15);
    }

    @keyframes fade-in {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
    }
</style>

{% endblock %}
